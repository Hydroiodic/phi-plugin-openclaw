name: Format

# Pushes are formatted with Prettier and ESLint --fix and the result is committed back.
# Pull requests from forks cannot be pushed to, so they are only checked.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write
  actions: write

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    # Same-repository pull requests are already handled by the push run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        if: github.event_name == 'pull_request'
        run: pnpm run format:check

      - name: Format and commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm run format
          pnpm run lint:fix || echo "::warning::ESLint reported problems it cannot fix automatically; see the Checks workflow."
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'style: format with Prettier and ESLint'
          git push
          # Pushes made with GITHUB_TOKEN do not start workflows, so run them for the formatted commit.
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          gh workflow run package.yml --ref "$GITHUB_REF_NAME"
